<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face { font-family: F; src: url(Fredoka-700.ttf) format("truetype"); font-weight: 700; }
html, body { margin: 0; }
#banner {
  width: 2560px; height: 1440px; position: relative; overflow: hidden;
  background:
    repeating-linear-gradient(55deg, rgba(255,255,255,0) 0 110px, rgba(255,255,255,0.16) 110px 170px),
    radial-gradient(ellipse at 50% 45%, #ffdb55 0%, #ffc72c 70%, #ffb81f 100%);
}
.name {
  position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-54%);
  text-align: center; font-family: F; font-weight: 700; font-size: 270px; line-height: 1; letter-spacing: 4px;
}
.name span { paint-order: stroke fill; -webkit-text-stroke: 20px #1c1b2e; filter: drop-shadow(0 18px 0 rgba(28,27,46,0.28)); }
.w { color: #ffffff; }
.b { color: #4a9de0; margin-left: 40px; }
.deco { position: absolute; filter: drop-shadow(0 14px 0 rgba(28,27,46,0.22)); }
</style></head><body>
<div id="banner">
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="globe" viewBox="0 0 200 200">
        <clipPath id="gc"><circle cx="100" cy="100" r="88"/></clipPath>
        <circle cx="100" cy="100" r="88" fill="#4a9de0"/>
        <g clip-path="url(#gc)" fill="#6fd17a">
          <ellipse cx="60" cy="70" rx="45" ry="26"/><ellipse cx="140" cy="135" rx="55" ry="30"/><ellipse cx="150" cy="55" rx="25" ry="18"/>
        </g>
        <g clip-path="url(#gc)" fill="none" stroke="#1c1b2e" stroke-width="6" opacity="0.55">
          <ellipse cx="100" cy="100" rx="38" ry="88"/><line x1="0" y1="60" x2="200" y2="60"/><line x1="0" y1="100" x2="200" y2="100"/><line x1="0" y1="140" x2="200" y2="140"/>
        </g>
        <circle cx="100" cy="100" r="88" fill="none" stroke="#1c1b2e" stroke-width="12"/>
      </symbol>
      <symbol id="q" viewBox="0 0 120 170">
        <text x="60" y="140" text-anchor="middle" font-family="F" font-weight="700" font-size="170" fill="#ffffff" stroke="#1c1b2e" stroke-width="12" paint-order="stroke fill">?</text>
      </symbol>
      <symbol id="gear" viewBox="0 0 200 200">
        <g transform="translate(100 100)" fill="#ffffff" stroke="#1c1b2e" stroke-width="10" stroke-linejoin="round">
          <path d="M-12,-88 L12,-88 L16,-66 L34,-58 L52,-72 L70,-54 L56,-36 L64,-16 L88,-12 L88,12 L64,16 L56,36 L70,54 L52,72 L34,58 L16,66 L12,88 L-12,88 L-16,66 L-34,58 L-52,72 L-70,54 L-56,36 L-64,16 L-88,12 L-88,-12 L-64,-16 L-56,-36 L-70,-54 L-52,-72 L-34,-58 L-16,-66 Z"/>
          <circle r="24" fill="#4a9de0"/>
        </g>
      </symbol>
    </defs>
  </svg>

  <!-- decorations kept outside the mobile-safe centre strip (x 507–2053) -->
  <svg class="deco" style="left:150px; top:390px; transform:rotate(-12deg)" width="300" height="300"><use href="#globe"/></svg>
  <svg class="deco" style="left:330px; top:840px; transform:rotate(14deg)" width="150" height="212"><use href="#q"/></svg>
  <svg class="deco" style="left:2120px; top:330px; transform:rotate(18deg)" width="230" height="230"><use href="#gear"/></svg>
  <svg class="deco" style="left:2200px; top:760px; transform:rotate(-10deg)" width="250" height="250"><use href="#globe"/></svg>
  <svg class="deco" style="left:1990px; top:960px; transform:rotate(-16deg)" width="120" height="170"><use href="#q"/></svg>
  <svg class="deco" style="left:90px; top:1010px; transform:rotate(-8deg)" width="160" height="160"><use href="#gear"/></svg>

  <svg class="nameSvg" width="2560" height="1440" viewBox="0 0 2560 1440" style="position:absolute;left:0;top:0">
    <g font-family="F" font-weight="700" font-size="270" text-anchor="middle" letter-spacing="4">
      <!-- shadow -->
      <text x="1280" y="828" fill="rgba(28,27,46,0.28)" stroke="rgba(28,27,46,0.28)" stroke-width="20" stroke-linejoin="round"><tspan>Sohow</tspan><tspan dx="40">3D</tspan></text>
      <!-- outline + fill -->
      <text x="1280" y="810" stroke="#1c1b2e" stroke-width="20" stroke-linejoin="round" paint-order="stroke fill"><tspan fill="#ffffff">Sohow</tspan><tspan dx="40" fill="#4a9de0">3D</tspan></text>
    </g>
  </svg>
</div>
</body></html>
